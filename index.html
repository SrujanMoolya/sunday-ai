<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunday.AI - Advanced AI Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', 'Orbitron', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap');
        
        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        
        /* Navbar Styling */
        .navbar {
            background: linear-gradient(90deg, rgba(0,0,0,0.95), rgba(5,25,35,0.9));
            padding: 0.75rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 156, 255, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 0 15px rgba(0, 156, 255, 0.2);
        }
        
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.75rem;
            font-weight: bold;
            color: #00c3ff;
            display: flex;
            align-items: center;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 195, 255, 0.6);
        }
        
        .logo-icon {
            margin-right: 0.75rem;
            font-size: 1.8rem;
        }
        
        .nav-links {
            display: flex;
            gap: 2rem;
        }
        
        .nav-links a {
            color: #e2e8f0;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s, text-shadow 0.2s;
            padding: 0.5rem 0;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 1px;
            position: relative;
        }
        
        .nav-links a:hover {
            color: #00c3ff;
            text-shadow: 0 0 8px rgba(0, 195, 255, 0.6);
        }
        
        .nav-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: #00c3ff;
            transition: width 0.3s ease;
            box-shadow: 0 0 8px rgba(0, 195, 255, 0.6);
        }
        
        .nav-links a:hover::after {
            width: 100%;
        }
        
        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            background: radial-gradient(circle at top right, rgba(0, 50, 80, 0.1), transparent 70%),
                       radial-gradient(circle at bottom left, rgba(0, 100, 160, 0.1), transparent 70%);
            position: relative;
            overflow: hidden;
        }
        
        .main-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="none" stroke="rgba(0,156,255,0.1)" stroke-width="0.5"/></svg>');
            background-size: 50px 50px;
            opacity: 0.1;
            pointer-events: none;
        }
        
        /* Chat Container */
        .chat-container {
            width: 90%;
            max-width: 1200px;
            height: 75vh;
            background-color: rgba(0, 10, 20, 0.8);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(0, 156, 255, 0.2),
                        0 0 0 1px rgba(0, 156, 255, 0.2),
                        inset 0 0 20px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            animation: pulse 4s infinite alternate;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 30px rgba(0, 156, 255, 0.2), 0 0 0 1px rgba(0, 156, 255, 0.2); }
            100% { box-shadow: 0 0 40px rgba(0, 195, 255, 0.4), 0 0 0 1px rgba(0, 195, 255, 0.4); }
        }
        
        .chat-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, transparent, rgba(0, 156, 255, 0.3), transparent);
            z-index: -1;
            border-radius: 14px;
            animation: rotate 6s linear infinite;
        }
        
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Chat Layout */
        .chat-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        /* Chat Header */
        .chat-header {
            background: linear-gradient(90deg, rgba(0,15,25,0.95), rgba(0,20,35,0.95));
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 156, 255, 0.3);
        }
        
        .chat-title {
            color: #00c3ff;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .header-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .status-indicator {
            width: 10px;
            height: 10px;
            background-color: #00c3ff;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(0, 195, 255, 0.8);
            animation: blink 2s infinite alternate;
        }
        
        @keyframes blink {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        
        .status-text {
            color: #7dd3fc;
            font-size: 0.875rem;
            font-family: 'Rajdhani', sans-serif;
        }
        
        .header-controls {
            display: flex;
            gap: 1rem;
        }
        
        .header-button {
            background: rgba(0, 50, 80, 0.5);
            border: 1px solid rgba(0, 156, 255, 0.3);
            border-radius: 4px;
            padding: 0.4rem 0.75rem;
            color: #7dd3fc;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .header-button:hover {
            background: rgba(0, 80, 120, 0.5);
            border-color: rgba(0, 156, 255, 0.6);
            color: #00c3ff;
            box-shadow: 0 0 8px rgba(0, 156, 255, 0.3);
        }
        
        /* Visualization Container */
        .vis-container {
            width: 260px;
            background-color: rgba(0, 10, 15, 0.7);
            border-right: 1px solid rgba(0, 156, 255, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .vis-header {
            padding: 1rem;
            border-bottom: 1px solid rgba(0, 156, 255, 0.2);
            color: #7dd3fc;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .vis-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1rem;
            overflow: hidden;
        }
        
        .vis-section {
            margin-bottom: 1.5rem;
        }
        
        .vis-title {
            color: #00c3ff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }
        
        .system-stats {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 0.25rem 0;
            border-bottom: 1px solid rgba(0, 156, 255, 0.1);
        }
        
        .stat-label {
            color: #7dd3fc;
            font-size: 0.75rem;
        }
        
        .stat-value {
            color: #ffffff;
            font-size: 0.75rem;
        }
        
        .audio-visualizer {
            width: 100%;
            height: 60px;
            background-color: rgba(0, 20, 40, 0.5);
            border-radius: 4px;
            display: flex;
            align-items: flex-end;
            padding: 0.25rem;
            gap: 2px;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.3);
        }
        
        .audio-bar {
            flex: 1;
            background: linear-gradient(to top, #00547a, #00c3ff);
            border-radius: 1px;
            animation: equalize 1.3s ease-in-out infinite alternate;
        }
        
        .audio-bar:nth-child(1) { animation-delay: -1.2s; height: 30%; }
        .audio-bar:nth-child(2) { animation-delay: -0.2s; height: 60%; }
        .audio-bar:nth-child(3) { animation-delay: -0.9s; height: 40%; }
        .audio-bar:nth-child(4) { animation-delay: -0.6s; height: 80%; }
        .audio-bar:nth-child(5) { animation-delay: -0.3s; height: 20%; }
        .audio-bar:nth-child(6) { animation-delay: -1.0s; height: 50%; }
        .audio-bar:nth-child(7) { animation-delay: -0.7s; height: 70%; }
        .audio-bar:nth-child(8) { animation-delay: -0.4s; height: 30%; }
        .audio-bar:nth-child(9) { animation-delay: -1.1s; height: 40%; }
        .audio-bar:nth-child(10) { animation-delay: -0.8s; height: 60%; }
        .audio-bar:nth-child(11) { animation-delay: -0.5s; height: 20%; }
        .audio-bar:nth-child(12) { animation-delay: -0.2s; height: 50%; }
        
        @keyframes equalize {
            0% { height: 10%; }
            100% { height: 80%; }
        }
        
        .circular-progress {
            width: 120px;
            height: 120px;
            position: relative;
            margin: 0 auto;
        }
        
        .progress-ring {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
        }
        
        .progress-ring::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid rgba(0, 50, 80, 0.3);
        }
        
        .progress-ring::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #00c3ff;
            animation: rotate 1.5s linear infinite;
        }
        
        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        
        .progress-percentage {
            color: #00c3ff;
            font-size: 1.5rem;
            font-weight: 600;
            font-family: 'Orbitron', sans-serif;
        }
        
        .progress-label {
            color: #7dd3fc;
            font-size: 0.75rem;
            text-transform: uppercase;
        }
        
        /* Chat Main */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><circle cx="50" cy="50" r="1" fill="rgba(0,156,255,0.15)"/></svg>');
            background-size: 30px 30px;
        }
        
        /* Chat Box */
        .chat-box {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            scroll-behavior: smooth;
        }
        
        /* Message Bubbles */
        .message {
            display: flex;
            gap: 1rem;
            max-width: 85%;
            animation: fadeIn 0.3s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
        }
        
        .avatar::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            border-radius: 50%;
            border: 1px solid rgba(0, 156, 255, 0.3);
            animation: pulse-avatar 2s infinite alternate;
        }
        
        @keyframes pulse-avatar {
            0% { border-color: rgba(0, 156, 255, 0.3); }
            100% { border-color: rgba(0, 195, 255, 0.6); }
        }
        
        .user-avatar {
            background: linear-gradient(45deg, #012a3d, #024e73);
            box-shadow: 0 0 10px rgba(0, 156, 255, 0.3);
        }
        
        .ai-avatar {
            background: linear-gradient(45deg, #00547a, #0087c3);
            box-shadow: 0 0 10px rgba(0, 156, 255, 0.5);
        }
        
        .message-content {
            padding: 1rem 1.25rem;
            border-radius: 8px;
            line-height: 1.6;
            position: relative;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 0.5px;
        }
        
        .user-message .message-content {
            background-color: rgba(0, 25, 50, 0.6);
            border: 1px solid rgba(0, 156, 255, 0.2);
            color: #e5e7eb;
            border-bottom-right-radius: 2px;
        }
        
        .ai-message .message-content {
            background-color: rgba(0, 40, 70, 0.6);
            border: 1px solid rgba(0, 156, 255, 0.3);
            color: #f3f4f6;
            border-bottom-left-radius: 2px;
        }
        
        .message-content::before {
            content: '';
            position: absolute;
            top: 0;
            width: 20%;
            height: 1px;
            background: linear-gradient(90deg, rgba(0, 156, 255, 0.6), transparent);
        }
        
        .ai-message .message-content::before {
            left: 0;
        }
        
        .user-message .message-content::before {
            right: 0;
            background: linear-gradient(90deg, transparent, rgba(0, 156, 255, 0.3));
        }
        
        .ai-message {
            align-self: flex-start;
        }
        
        .user-message {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        
        .error-message .message-content {
            background-color: rgba(180, 30, 30, 0.2);
            border: 1px solid rgba(255, 50, 50, 0.3);
        }
        
        .message-timestamp {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 0.5rem;
            text-align: right;
        }
        
        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: #7dd3fc;
            font-style: italic;
            align-self: center;
            padding: 0.75rem 1.5rem;
            background-color: rgba(0, 20, 40, 0.6);
            border-radius: 20px;
            border: 1px solid rgba(0, 156, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 156, 255, 0.1);
            animation: pulse-loading 1.5s infinite alternate;
        }
        
        @keyframes pulse-loading {
            0% { box-shadow: 0 0 15px rgba(0, 156, 255, 0.1); }
            100% { box-shadow: 0 0 20px rgba(0, 156, 255, 0.3); }
        }
        
        .loading-text {
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 1px;
        }
        
        .loading-dots {
            display: flex;
            gap: 4px;
        }
        
        .loading-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #00c3ff;
            animation: loading-dot 1.4s infinite ease-in-out;
            box-shadow: 0 0 5px rgba(0, 195, 255, 0.5);
        }
        
        .loading-dot:nth-child(1) { animation-delay: 0s; }
        .loading-dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes loading-dot {
            0%, 80%, 100% { transform: scale(0.5); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
        
        /* Chat Input */
        .chat-input {
            background: linear-gradient(180deg, rgba(0,15,25,0.95), rgba(0,20,35,0.95));
            border-top: 1px solid rgba(0, 156, 255, 0.3);
            padding: 1.25rem;
            position: relative;
        }
        
        .chat-input::before {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 156, 255, 0.6), transparent);
        }
        
        .input-container {
            display: flex;
            gap: 1rem;
            position: relative;
        }
        
        .input-field-container {
            flex: 1;
            position: relative;
        }
        
        .chat-input input {
            width: 100%;
            padding: 0.875rem 1rem;
            background-color: rgba(0, 25, 50, 0.5);
            color: #ffffff;
            border: 1px solid rgba(0, 156, 255, 0.3);
            border-radius: 6px;
            font-size: 1rem;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }
        
        .chat-input input:focus {
            outline: none;
            background-color: rgba(0, 35, 65, 0.6);
            border-color: rgba(0, 156, 255, 0.6);
            box-shadow: 0 0 10px rgba(0, 156, 255, 0.2);
        }
        
        .input-actions {
            display: flex;
            gap: 0.5rem;
        }
        
        .input-action-btn {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            background: rgba(0, 35, 65, 0.7);
            border: 1px solid rgba(0, 156, 255, 0.3);
            color: #00c3ff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .input-action-btn:hover {
            background: rgba(0, 45, 80, 0.8);
            border-color: rgba(0, 156, 255, 0.6);
            box-shadow: 0 0 10px rgba(0, 156, 255, 0.2);
        }
        
        .send-btn {
            position: relative;
            overflow: hidden;
            background: linear-gradient(45deg, #00547a, #0087c3);
        }
        
        .send-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }
        
        @keyframes shine {
            0% { transform: translateX(-300%) rotate(45deg); }
            100% { transform: translateX(300%) rotate(45deg); }
        }
        
        /* Footer */
        .footer {
            background-color: rgba(0, 10, 20, 0.9);
            padding: 1rem 2rem;
            border-top: 1px solid rgba(0, 156, 255, 0.2);
            text-align: center;
        }
        
        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            font-family: 'Rajdhani', sans-serif;
        }
        
        .tech-stack {
            display: flex;
            gap: 1.5rem;
            color: #7dd3fc;
            font-size: 0.875rem;
        }
        
        .tech-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .tech-icon {
            color: #00c3ff;
        }
        
        .footer-credits {
            color: #7dd3fc;
            font-size: 0.875rem;
        }
        
        .footer-credits a {
            color: #00c3ff;
            text-decoration: none;
            transition: text-shadow 0.2s;
        }
        
        .footer-credits a:hover {
            text-shadow: 0 0 8px rgba(0, 195, 255, 0.6);
        }
        
        /* Hexagon Pattern */
        .hex-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.03;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="56" height="100" viewBox="0 0 56 100"><path fill="none" stroke="rgba(0,195,255,1)" stroke-width="0.5" d="M28 66L0 50L0 16L28 0L56 16L56 50L28 66L28 100" /></svg>');
            background-size: 56px 100px;
        }
        
        /* Scan Lines Effect */
        .scan-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            background: linear-gradient(
                to bottom,
                transparent 50%,
                rgba(0, 0, 0, 0.02) 51%,
                transparent 51%
            );
            background-size: 100% 4px;
            opacity: 0.15;
        }
        
        /* Responsive Styles */
        @media (max-width: 1024px) {
            .chat-container {
                width: 95%;
                height: 80vh;
            }
            
            .vis-container {
                width: 220px;
            }
        }
        
        @media (max-width: 768px) {
            .chat-layout {
                flex-direction: column;
            }
            
            .vis-container {
                display: none;
            }
            
            .footer-content {
                flex-direction: column;
                gap: 1rem;
            }
            
            .tech-stack {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
        
        @media (max-width: 640px) {
            .navbar {
                padding: 0.75rem 1rem;
            }
            
            .main-content {
                padding: 1rem;
            }
            
            .chat-container {
                width: 100%;
                height: 85vh;
            }
            
            .message {
                max-width: 100%;
            }
            
            .footer {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Scan Lines Effect -->
    <div class="scan-lines"></div>
    
    <!-- Hexagon Pattern -->
    <div class="hex-pattern"></div>
    
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">
            <span class="logo-icon">⦿</span>
            Sunday.AI
        </div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="https://svvaap.in" target="_blank">svvaap.in</a>
            <a href="#">Developed by Srujan Moolya</a>
        </div>
    </nav>
    
    <!-- Main Content -->
    <div class="main-content">
        <div class="chat-container">
            <!-- Chat Header -->
            <div class="chat-header">
                <div class="chat-title">
